version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --loglevel=error
    build:
      commands:
        - npm run build
    postBuild:
      commands:
        - ls -la out/ && echo "BUILD SUCCESS - out/ exists"
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
