<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms — detection skeleton</title>
  </head>
  <body>
    <!-- Project enquiry form (Tab 1: Start a Project) -->
    <form name="project-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="location" />
      <input name="project_type" type="checkbox" />
      <input name="consultation_type" type="radio" />
      <textarea name="message"></textarea>
    </form>

    <!-- Vendor enquiry form (Tab 2: Vendors) -->
    <form name="vendor-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="vendor-enquiry" />
      <input name="bot-field" />
      <input name="company_name" />
      <input name="contact_person" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="category" type="checkbox" />
      <textarea name="services"></textarea>
      <input name="website_url" type="url" />
      <input name="showroom_location" />
    </form>

    <!-- Careers enquiry form (Tab 3: Careers) -->
    <form name="careers-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="careers-enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="career_type" type="checkbox" />
      <input name="experience_level" type="radio" />
      <input name="portfolio_url" type="url" />
      <input name="portfolio_pdf" type="file" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
